<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>listGuest</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="list-header">
        <div class="head">
            <h1>Коктельная вечеринка</h1>
        </div>
    </header>
    <main class="main">
        <section class="section">
            <h1 class="one">Заполните, чтобы вас внесли в список гостей.</h1>

            <p class="two">
                <label>Имя</label>
                <input type="text" placeholder="" required>
            </p>

            <p class="three">
                <label>Настроение на вечер</label>
                <input type="text" placeholder="Отличное" required>
            </p>
            <p class="four">
                <label>Предпочитаемый напиток</label>
                <input type="text" placeholder="Вишневый коктель" required>
            </p>

            <label class="five">Комментарии</label>
            <textarea class="five" placeholder="Напишите ваши идеи, для идеального вечера"></textarea>
            <button class="six" type="submit">Записаться</button>
        </section>
        <img class="image" src="vecteezy_refreshing-red-cocktail-with-cherries-on-transparent_59319710.png">
    </main>

</body>

</html>
